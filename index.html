  <body class="demo">
    <header>
      <h1>cracked-up live demo</h1>
      <button id="toggle" type="button">Start audio</button>
      <button id="reset" type="button">Reset code</button>
      <a class="nav" href="./docs.html" target="cracked-up-docs">Docs</a>
      <a class="nav" href="./sandbox.html">Sandboxed version</a>
      <span id="status">Audio is off. Press Start, or just type.</span>
    </header>
    <main>
      <div class="editor">
        <!-- The coloured copy of the code. The textarea above it holds the real text. -->
        <pre id="highlight" aria-hidden="true"><code></code></pre>
        <textarea
          id="editor"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-label="Code"
        ></textarea>
      </div>
      <aside>
        <h2>Samples</h2>
        <ul id="samples"></ul>
        <h2>Node types</h2>
        <ul id="types"></ul>
        <h2>Helpers</h2>
        <ul id="helpers"></ul>
        <div id="helper-groups"></div>
        <p class="more">
          <a href="./docs.html#helpers" target="cracked-up-docs">What each helper does</a>
        </p>
      </aside>
    </main>
    <div id="message" role="status"></div>
