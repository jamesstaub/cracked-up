# Runs on every push and pull request: the same checks a release has to pass.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # GitHub's machines may have no sound device, so the two tests that need a live one are skipped.
      VITE_SKIP_LIVE_AUDIO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
