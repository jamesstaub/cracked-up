<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cracked-up live demo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f1;
        --panel: #ffffff;
        --text: #1d1d1b;
        --muted: #6b6a65;
        --border: #d9d7cf;
        --accent: #b4530a;
        --error-bg: #fdecea;
        --error-text: #9b1c14;
        --ok: #2f7d4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171716;
          --panel: #1f1f1d;
          --text: #ecebe6;
          --muted: #98968f;
          --border: #34332f;
          --accent: #f0a35e;
          --error-bg: #3a1917;
          --error-text: #ffb4ab;
          --ok: #7fd3a0;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      #status {
        color: var(--muted);
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      #status.running {
        color: var(--ok);
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        min-height: 0;
      }
      #editor {
        width: 100%;
        height: 100%;
        resize: none;
        border: 0;
        outline: 0;
        padding: 16px;
        background: var(--panel);
        color: var(--text);
        font:
          13px/1.6 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        tab-size: 2;
        white-space: pre;
        overflow: auto;
      }
      aside {
        border-left: 1px solid var(--border);
        padding: 12px 16px;
        overflow: auto;
      }
      aside h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      aside h2:not(:first-child) {
        margin-top: 20px;
      }
      aside ul {
        list-style: none;
        margin: 0;
        padding: 0;
        font:
          12px/1.7 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
      }
      aside li span {
        color: var(--muted);
      }
      #message {
        min-height: 34px;
        padding: 8px 16px;
        border-top: 1px solid var(--border);
        font:
          12px/1.5 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
        color: var(--muted);
        white-space: pre-wrap;
      }
      #message.error {
        background: var(--error-bg);
        color: var(--error-text);
      }
      @media (max-width: 720px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--border);
          max-height: 30vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>cracked-up live demo</h1>
      <button id="toggle" type="button">Start audio</button>
      <button id="reset" type="button">Reset code</button>
      <span id="status">Audio is off. Press Start, or just type.</span>
    </header>
    <main>
      <textarea
        id="editor"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        aria-label="Code"
      ></textarea>
      <aside>
        <h2>Samples</h2>
        <ul id="samples"></ul>
        <h2>Node types</h2>
        <ul id="types"></ul>
        <h2>Helpers</h2>
        <ul id="helpers"></ul>
      </aside>
    </main>
    <div id="message" role="status"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
